# Local development stack: Postgres + API (with hot-reload via mounted source).
# Frontend runs separately via `npm run dev` in apps/web/ so Vite HMR works.
#
# Usage:
#   docker compose -f infra/docker/docker-compose.dev.yml up -d
#   # then in another terminal:
#   cd apps/web && npm install && npm run dev

name: fm-dev

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: fm-dev-postgres
    environment:
      POSTGRES_DB: fm_stoerungen
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pg_data_dev:/var/lib/postgresql/data
      - ./postgres-init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ../../apps/api
      dockerfile: Dockerfile
      target: builder  # keep dev deps for hot-reload
    container_name: fm-dev-api
    command: >
      uvicorn fm_api.main:app
      --host 0.0.0.0 --port 8000
      --reload --reload-dir /app/src
    environment:
      ENV: dev
      DEBUG: "true"
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/fm_stoerungen
      JWT_SECRET: dev-only-secret-min-32-chars-not-for-prod
      CORS_ALLOW_ORIGINS: '["http://localhost:5173"]'
    volumes:
      - ../../apps/api/src:/app/src:ro
      - ../../apps/api/alembic:/app/alembic:ro
      - ../../apps/api/alembic.ini:/app/alembic.ini:ro
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pg_data_dev:
