version: 2

# Schicht 4 der 12-Schichten-Sicherheitsarchitektur (Tech-Spec Kapitel 10.3):
# Auto-Updates bei CVE-Fixes, Lockfile-Pflicht.

updates:
  # GitHub Actions
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - github-actions

