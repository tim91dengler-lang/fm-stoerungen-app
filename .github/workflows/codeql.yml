name: CodeQL — Security-Scan

# Schicht 3 der 12-Schichten-Sicherheitsarchitektur (Tech-Spec Kapitel 10.3):
# automatischer Security-Scan auf SQL-Injection, XSS, Auth-Probleme.
# Aktiviert sobald JS/TS und Python im Repo vorhanden sind.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Wöchentlicher Re-Scan am Sonntagabend
    - cron: '0 22 * * 0'

jobs:
  analyze:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: ['javascript-typescript', 'python']

    steps:
      - uses: actions/checkout@v6

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-extended,security-and-quality

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{matrix.language}}"
