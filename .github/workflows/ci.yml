  doc-check:
    name: Doku-Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Markdown-Lint
        uses: DavidAnson/markdownlint-cli2-action@v16
        continue-on-error: true
        with:
          globs: |
            docs/**/*.md
            README.md

      - name: Tote Markdown-Links prüfen
        uses: lycheeverse/lychee-action@v1
        continue-on-error: true
        with:
          args: --no-progress --max-concurrency 5 --exclude-mail './**/*.md'
          fail: false
