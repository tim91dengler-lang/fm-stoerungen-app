name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Sicherheits-Schichten gemäß Tech-Spec Kapitel 10.3 (12-Schichten-Architektur).
# Dieses Skelett ist Phase 0 — wird erweitert sobald Code im Repo ist.

permissions:
  contents: read
  pull-requests: write
  security-events: write

jobs:

  # ---------------- Schicht 5: Pre-Commit-Checks (Secrets, Filesize) ----------
  pre-checks:
    name: Pre-Checks (Secrets, Großdateien)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks — Secret-Scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check Dateigröße (max 10 MB pro Datei)
        run: |
          large=$(find . -type f -size +10M -not -path './.git/*' || true)
          if [ -n "$large" ]; then
            echo "::error::Dateien > 10 MB im Repo gefunden:"
            echo "$large"
            exit 1
          fi

