name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 12-Schichten-Sicherheitsarchitektur, Tech-Spec Kapitel 10.3.

permissions:
  contents: read
  pull-requests: write
  security-events: write

jobs:

  # ----- Schicht 5: Pre-Commit-Checks ---------------------------------------
  pre-checks:
    name: Pre-Checks (Secrets, Großdateien)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Gitleaks — Secret-Scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Dateigröße (max 10 MB)
        shell: bash
        run: |
          large=$(find . -type f -size +10M -not -path './.git/*' -not -path './node_modules/*' || true)
          if [ -n "$large" ]; then
            echo "::error::Dateien > 10 MB im Repo gefunden:"
            echo "$large"
            exit 1
          fi

  # ----- Schicht 2: Backend Lint + Type-Check + Tests -----------------------
  backend:
    name: Backend (ruff + mypy + pytest)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fm_stoerungen_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    defaults:
      run:
        working-directory: apps/api
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/fm_stoerungen_test
      JWT_SECRET: ci-test-secret-32-chars-not-for-prod
      ENV: test
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff (lint + format check)
        run: |
          ruff check .
          ruff format --check .

      - name: mypy (strict)
        run: mypy src

      - name: Bandit (security)
        run: bandit -q -r src

      - name: Enable Postgres extensions
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d fm_stoerungen_test \
            -c "CREATE EXTENSION IF NOT EXISTS pgcrypto; CREATE EXTENSION IF NOT EXISTS pg_trgm; CREATE EXTENSION IF NOT EXISTS vector;"

      - name: pytest (Unit + Integration)
        # Coverage threshold is configured in pyproject.toml — currently 50% (Slice-1-Baseline)
        run: pytest --cov=src/fm_api --cov-report=xml

      - uses: codecov/codecov-action@v6
        if: always()
        with:
          files: apps/api/coverage.xml
          flags: backend
          fail_ci_if_error: false

  # ----- Schicht 2: Frontend Lint + Type-Check + Tests + Build --------------
  frontend:
    name: Frontend (eslint + tsc + vitest + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/web/package-lock.json

      - name: Install
        # Use `npm install` until a lockfile is committed.
        # Once apps/web/package-lock.json exists we switch back to `npm ci`.
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install --no-audit --no-fund
          fi

      - name: Lint
        run: npm run lint

      - name: Type-Check
        run: npm run typecheck

      - name: Unit-Tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: apps/web/dist
          retention-days: 7

  # ----- Schicht 4: Dependency-Audit ---------------------------------------
  deps-audit:
    name: Dependency-Audit (pip-audit + npm audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: pip-audit (Backend)
        working-directory: apps/api
        run: |
          pip install pip-audit
          pip-audit --strict || true   # don't fail build, but produce report

      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/web/package-lock.json
      - name: npm audit (Frontend, high+)
        working-directory: apps/web
        run: npm audit --omit=dev --audit-level=high || true

  # ----- Schicht 2: Semgrep (OWASP) ----------------------------------------
  semgrep:
    name: Semgrep (OWASP, Python, TS)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v6
      - uses: returntocorp/semgrep-action@v1
        with:
          config: >-
            p/security-audit
            p/owasp-top-ten
            p/python
            p/typescript

  # ----- Doc checks (non-blocking) -----------------------------------------
  doc-check:
    name: Doku-Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Markdown-Lint
        uses: DavidAnson/markdownlint-cli2-action@v24
        continue-on-error: true
        with:
          globs: |
            docs/**/*.md
            README.md

      - name: Tote Markdown-Links prüfen
        uses: lycheeverse/lychee-action@v2
        continue-on-error: true
        with:
          args: --no-progress --max-concurrency 5 --exclude-mail './**/*.md'
          fail: false

  # ----- CI-Gate: alle obigen Jobs müssen grün sein -------------------------
  ci-ok:
    name: CI OK
    runs-on: ubuntu-latest
    needs: [pre-checks, backend, frontend, deps-audit, semgrep]
    if: always()
    steps:
      - name: Verify all required jobs passed
        run: |
          # Semgrep (Schicht 2, Security) ist jetzt blockierend — vorher lief der Job,
          # sein Ergebnis wurde hier aber nie geprüft, sodass Funde durchrutschten.
          if [[ "${{ needs.pre-checks.result }}" != "success" || \
                "${{ needs.backend.result }}"   != "success" || \
                "${{ needs.frontend.result }}"  != "success" || \
                "${{ needs.semgrep.result }}"   != "success" ]]; then
            echo "::error::A required job failed (pre-checks / backend / frontend / semgrep)."
            exit 1
          fi
          echo "All required jobs passed."
