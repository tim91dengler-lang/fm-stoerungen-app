server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # SPA fallback — React Router handles client-side routing
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Basic security headers (Schicht 2). NOTE: nginx does NOT merge add_header
  # across levels — any `location` with its own add_header loses these. They are
  # therefore repeated in each location below that sets its own headers.
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  # Service worker MUST revalidate so new deploys are picked up — must beat the
  # generic .js immutable rule below (exact-match `location =` wins in nginx).
  location = /sw.js {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  }

  # Correct MIME type for the PWA manifest (alpine mime.types lacks .webmanifest,
  # which otherwise serves as application/octet-stream).
  location = /manifest.webmanifest {
    types { } default_type application/manifest+json;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  }

  # Long cache for hashed assets, no cache for index.html
  location ~* \.(?:js|css|woff2?|ttf|otf|svg|png|jpg|jpeg|gif|webp|ico)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    add_header X-Content-Type-Options "nosniff" always;
  }

  location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  }

  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;
  gzip_min_length 256;
}
