[project]
name = "fm-api"
version = "0.1.0"
description = "FM-Stoerungen API — Slice 1: Auth + User-CRUD + Tickets-CRUD"
requires-python = ">=3.12"
authors = [{ name = "Tim Dengler", email = "td@tdengler-consulting.com" }]

dependencies = [
    "fastapi[standard]>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "alembic>=1.14.0",
    "asyncpg>=0.30.0",
    "psycopg[binary]>=3.2.0",
    "passlib[bcrypt]>=1.7.4",
    "python-jose[cryptography]>=3.3.0",
    "python-multipart>=0.0.17",
    "email-validator>=2.2.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "bandit[toml]>=1.8.0",
    "types-passlib",
    "types-python-jose",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fm_api"]

# ----------------------------------------------------------------------
# Ruff (Linting + Formatting) — strict per CLAUDE.md
# ----------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "S",   # flake8-bandit (security)
    "N",   # pep8-naming
    "RUF", # ruff-specific
    "TID", # tidy-imports
    "ASYNC", # async lints
]
ignore = [
    "E501",  # line too long (formatter handles)
    "S101",  # use of assert (ok in tests)
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S105", "S106", "S311"]
"alembic/**/*.py" = ["E402", "F401"]
# FastAPI route handlers use Query/Header/Depends as default arg values by design
"src/fm_api/api/**/*.py" = ["B008"]
# token_type literals like "bearer" / "access" / "refresh" are protocol identifiers, not credentials
"src/fm_api/core/security.py" = ["S105", "S106"]
"src/fm_api/schemas/auth.py" = ["S105"]
# Pydantic generics still need typing.Generic[T] in Pydantic 2.x — type-parameter syntax (PEP 695) not fully supported yet
"src/fm_api/schemas/common.py" = ["UP046"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ----------------------------------------------------------------------
# mypy (Type Checking) — strict per CLAUDE.md
# ----------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["passlib.*", "jose.*"]
ignore_missing_imports = true

# ----------------------------------------------------------------------
# pytest
# ----------------------------------------------------------------------
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--cov=src/fm_api",
    "--cov-report=term-missing",
    "--cov-report=xml",
    # Slice 1 baseline: pytest covers auth + tickets-CRUD endpoints (~60%).
    # Target 80% is enforced once Slice 2 lifts test depth (services, edge-cases).
    "--cov-fail-under=50",
]
markers = [
    "unit: unit tests (no external deps)",
    "integration: integration tests (require database)",
    "slow: slow tests",
]

[tool.coverage.run]
source = ["src/fm_api"]
omit = ["**/__init__.py", "src/fm_api/main.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]

# ----------------------------------------------------------------------
# Bandit (Security) — Schicht 2
# ----------------------------------------------------------------------
[tool.bandit]
exclude_dirs = ["tests", "alembic"]
skips = ["B101"]  # assert_used
